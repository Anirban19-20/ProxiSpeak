server.port=8080

# ---- MongoDB ----
# Local MongoDB:  mongodb://localhost:27017/proxispeak
# MongoDB Atlas:  mongodb+srv://<user>:<password>@<cluster>.mongodb.net/proxispeak
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/proxispeak}
# Needed so @Indexed(unique = true) (username, email, roomCode) is actually created
spring.data.mongodb.auto-index-creation=true

# ---- JWT (Member 3's realtime server must use the SAME secret, min 32 chars) ----
proxispeak.jwt.secret=${JWT_SECRET:change-this-secret-to-a-long-random-string-123456}
proxispeak.jwt.expiration-ms=86400000

# ---- CORS (Member 1's frontend origins) ----
proxispeak.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

# ---- Room defaults ----
proxispeak.room.default-max-users=50
